<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador do Braço</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d232b; --muted: #5d6875; --line: #d9dee4;
    --arm: #1f5fbf; --accent: #e0861a; --ok: #1d8a4e; --bad: #c0392b; --grid: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b; --panel: #1b2128; --ink: #e6eaef; --muted: #98a3ae; --line: #2d353f;
      --arm: #5b9cff; --accent: #f0a040; --ok: #3cc47c; --bad: #ff6b5b; --grid: #222a33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161b; --panel: #1b2128; --ink: #e6eaef; --muted: #98a3ae; --line: #2d353f;
    --arm: #5b9cff; --accent: #f0a040; --ok: #3cc47c; --bad: #ff6b5b; --grid: #222a33;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1.4fr 1fr; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  canvas { width: 100%; height: auto; display: block; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600;
          border: 1px solid var(--line); margin: 0 6px 6px 0; }
  .on { color: var(--ok); border-color: var(--ok); }
  .off { color: var(--bad); border-color: var(--bad); }
  .state { font: 600 22px/1.2 ui-monospace, Menlo, monospace; margin: 4px 0 8px; }
  .keys { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .key { min-width: 34px; text-align: center; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line);
         font: 600 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .key.down { background: var(--accent); border-color: var(--accent); color: #111; }
  .joint { margin: 8px 0 12px; }
  .joint .top { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 10px; background: var(--grid); border-radius: 5px; margin-top: 4px; }
  .bar .cur { position: absolute; top: -3px; width: 4px; height: 16px; background: var(--arm); border-radius: 2px; }
  .dir { font-weight: 700; color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
  td:first-child { font-weight: 600; width: 92px; }
  tr.active td { color: var(--accent); }
  .log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 200px; overflow: auto;
         white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>Simulador do braço</h1>
  <p class="sub" id="sub">Faz o papel do ESP32 do braço: recebe o controle do snes_arm_daemon e não responde.</p>

  <div class="grid">
    <section class="card">
      <h2>Vista lateral (ombro e cotovelo)</h2>
      <canvas id="side" width="640" height="360"></canvas>
    </section>

    <section class="card">
      <h2>Controle recebido</h2>
      <div id="pills"></div>
      <div class="state" id="state">0xFFFF</div>
      <div class="keys" id="keys"></div>
      <div id="joints"></div>
    </section>

    <section class="card">
      <h2>Vista de cima (base) e garra</h2>
      <canvas id="top" width="640" height="300"></canvas>
    </section>

    <section class="card">
      <h2 id="mapping-title">Mapeamento (wiki do William)</h2>
      <table id="mapping"></table>
      <h2 style="margin-top:14px">Eventos</h2>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>

<script>
const L1 = 80, L2 = 80, GRIP = 50, BASE_H = 45;   // mm, aproximado do MeArm de acrílico
const KEYS = ["UP", "DOWN", "LEFT", "RIGHT", "B", "Y", "A", "X", "START", "SELECT", "L", "R"];
const MAPPING = [
  [["LEFT", "RIGHT"], "← / →", "girar a base"],
  [["UP", "DOWN"], "↑ / ↓", "subir / descer o ombro"],
  [["B"], "B", "subir o cotovelo"],
  [["Y"], "Y", "descer o cotovelo"],
  [["A"], "A", "abrir a garra"],
  [["X"], "X", "fechar a garra"],
  [["SELECT"], "Select", "modo acelerômetro (no joystick)"],
  [["START"], "Start", "parar os movimentos"],
];
// firmwareBraco.ino (William), pressButton(): 1° por linha recebida; Start/Select/L/R caem no "default".
const MAPPING_WILLIAM = [
  [["LEFT"], "←", "base +1° (pino 13)"],
  [["RIGHT"], "→", "base −1°"],
  [["UP"], "↑", "ombro +1° (pino 14)"],
  [["DOWN"], "↓", "ombro −1°"],
  [["B"], "B", "cotovelo +1° (pino 18)"],
  [["Y"], "Y", "cotovelo −1°"],
  [["A"], "A", "garra +1°, abre (pino 26)"],
  [["X"], "X", "garra −1°, fecha"],
  [["START", "SELECT", "L", "R"], "Start / Select / L / R", "nada (default)"],
];
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const rad = d => d * Math.PI / 180;

function kinematics(a) {
  const [, ombro, cotovelo] = a;
  const t1 = rad(ombro), phi = rad(cotovelo - 90);
  const elbow = { x: L1 * Math.cos(t1), y: BASE_H + L1 * Math.sin(t1) };
  const wrist = { x: elbow.x + L2 * Math.cos(phi), y: elbow.y + L2 * Math.sin(phi) };
  return { elbow, wrist, reach: wrist.x + GRIP };
}

function gripOpen(a, joints) {
  return (a[3] - joints[3].min) / (joints[3].max - joints[3].min);
}

function drawSide(ctx, a, joints) {
  const W = ctx.canvas.width, H = ctx.canvas.height, s = 1.45, ox = W * 0.42, oy = H - 30;
  const P = p => [ox + p.x * s, oy - p.y * s];
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 29) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 29) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = css("--muted"); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(20, oy); ctx.lineTo(W - 20, oy); ctx.stroke();
  ctx.fillStyle = css("--line"); ctx.fillRect(ox - 40, oy - BASE_H * s, 80, BASE_H * s);

  const k = kinematics(a), sh = P({ x: 0, y: BASE_H }), el = P(k.elbow), wr = P(k.wrist);
  const tip = P({ x: k.wrist.x + GRIP, y: k.wrist.y });
  const color = css("--arm");
  ctx.strokeStyle = color; ctx.lineWidth = 9; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(...el); ctx.lineTo(...wr); ctx.lineTo(...tip); ctx.stroke();
  const open = 4 + gripOpen(a, joints) * 14;
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(tip[0] - 14, tip[1] - open); ctx.lineTo(tip[0] + 6, tip[1] - open); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tip[0] - 14, tip[1] + open); ctx.lineTo(tip[0] + 6, tip[1] + open); ctx.stroke();
  for (const p of [sh, el, wr]) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(...p, 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = css("--muted"); ctx.font = "12px system-ui";
  ctx.fillText("frente →", W - 80, oy + 18);
}

function drawTop(ctx, a, joints) {
  const W = ctx.canvas.width, H = ctx.canvas.height, cx = W * 0.32, cy = H - 40, s = 0.95;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, 210 * s, Math.PI, 0); ctx.stroke();
  ctx.strokeStyle = css("--grid"); ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(cx, cy, 120 * s, -rad(joints[0].max), -rad(joints[0].min)); ctx.stroke();
  const r = Math.max(30, kinematics(a).reach) * s;
  ctx.strokeStyle = css("--arm"); ctx.lineWidth = 9; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(rad(a[0])), cy - r * Math.sin(rad(a[0]))); ctx.stroke();
  ctx.fillStyle = css("--arm"); ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 7); ctx.fill();

  const gx = W * 0.8, gy = H * 0.5, g = gripOpen(a, joints), open = 8 + g * 46;
  ctx.fillRect(gx - open - 14, gy - 50, 14, 100);
  ctx.fillRect(gx + open, gy - 50, 14, 100);
  ctx.fillStyle = css("--muted"); ctx.font = "12px system-ui";
  ctx.fillText(`garra ${Math.round(g * 100)}% aberta`, gx - 52, gy + 74);
  ctx.fillText(`base ${a[0]}°`, cx - 24, cy + 26);
}

function render(st) {
  const pill = (ok, yes, no) => `<span class="pill ${ok ? "on" : "off"}">${ok ? yes : no}</span>`;
  const william = st.protocol === "william";
  document.getElementById("sub").textContent = william
    ? "Faz o papel do ESP32 com o firmware do William (firmwareBraco.ino): lê 1 linha a cada 25 ms e anda 1° por botão."
    : "Faz o papel do ESP32 com o firmware SNES_ARM_ESP32: recebe os quadros de 8 bytes e não responde.";
  document.getElementById("mapping-title").textContent =
    william ? "Mapeamento (firmwareBraco.ino do William)" : "Mapeamento (wiki do William)";
  document.getElementById("pills").innerHTML =
    pill(st.connected, "snes_arm_daemon conectado", "sem conexão") +
    `<span class="pill">${st.rate_hz} ${william ? "linhas" : "quadros"}/s</span>` +
    `<span class="pill">válidos ${st.frames} · inválidos ${st.errors}</span>` +
    (william ? `<span class="pill">fila ${st.backlog} (máx ${st.max_backlog})</span>`
             : `<span class="pill">watchdog ${st.watchdog_events}</span>`);
  document.getElementById("state").textContent =
    "0x" + st.state.toString(16).toUpperCase().padStart(4, "0") +
    (st.last_seq === null ? "" : william ? `  linha ${st.last_seq}` : `  seq ${st.last_seq}`);
  document.getElementById("keys").innerHTML =
    KEYS.map(k => `<span class="key ${st.pressed.includes(k) ? "down" : ""}">${k}</span>`).join("");

  const sign = d => d > 0 ? "+1" : d < 0 ? "−1" : "0";
  document.getElementById("joints").innerHTML = st.joints.map((j, i) => {
    const pos = ((st.angles[i] - j.min) / (j.max - j.min) * 100).toFixed(1);
    return `<div class="joint"><div class="top"><span>${j.name}</span>
      <span>${st.angles[i]}° <span class="dir">${sign(st.dirs[i])}</span> <small>(${j.min}–${j.max})</small></span></div>
      <div class="bar"><div class="cur" style="left:calc(${pos}% - 2px)"></div></div></div>`;
  }).join("");

  document.getElementById("mapping").innerHTML = (william ? MAPPING_WILLIAM : MAPPING).map(([keys, label, what]) =>
    `<tr class="${keys.some(k => st.pressed.includes(k)) ? "active" : ""}"><td>${label}</td><td>${what}</td></tr>`).join("");
  document.getElementById("log").textContent = st.log.slice().reverse().join("\n");

  drawSide(document.getElementById("side").getContext("2d"), st.angles, st.joints);
  drawTop(document.getElementById("top").getContext("2d"), st.angles, st.joints);
}

async function tick() {
  try {
    render(await (await fetch("/state", { cache: "no-store" })).json());
  } catch (e) {
    document.getElementById("pills").innerHTML = '<span class="pill off">simulador parado</span>';
  }
  setTimeout(tick, 50);
}
tick();
</script>
</body>
</html>
